<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IoT 智能设备监控看板</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0b0f19',
                        cardBg: '#161b26',
                        borderBg: '#232d3f'
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .glass-card { background: rgba(22, 27, 38, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(35, 45, 63, 0.5); }
    </style>
</head>
<body class="bg-darkBg text-gray-100 min-h-screen">

    <header class="border-b border-borderBg bg-cardBg/50 backdrop-blur sticky top-0 z-50 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <div class="p-2 bg-blue-600/20 text-blue-500 rounded-lg">
                <i data-lucide="cpu" class="w-6 h-6"></i>
            </div>
            <div>
                <h1 class="text-lg font-bold tracking-wider text-white">IoT 智能设备监控看板</h1>
                <p class="text-xs text-gray-400">企业级多中心设备数据流式监测系统</p>
            </div>
        </div>
        <div class="flex items-center space-x-4">
            <div id="statusBadge" class="flex items-center space-x-2 bg-emerald-500/10 border border-emerald-500/20 px-3 py-1.5 rounded-full text-emerald-400 text-xs">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <span>数据流同步中</span>
            </div>
            <div id="alarmBadge" class="hidden flex items-center space-x-2 bg-rose-500/10 border border-rose-500/20 px-3 py-1.5 rounded-full text-rose-400 text-xs cursor-pointer relative" onclick="toggleAlarmPanel()">
                <span class="absolute -top-0.5 -right-0.5 flex h-3 w-3">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-rose-500 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-3 w-3 bg-rose-500"></span>
                </span>
                <i data-lucide="bell" class="w-3.5 h-3.5"></i>
                <span id="alarmCount">0 条告警</span>
            </div>
            <button id="refreshBtn" class="p-2 hover:bg-borderBg rounded-lg transition text-gray-400 hover:text-white" title="手动刷新">
                <i data-lucide="refresh-cw" class="w-5 h-5"></i>
            </button>
        </div>
    </header>

    <div id="alarmOverlay" class="hidden fixed inset-0 z-40" onclick="toggleAlarmPanel()"></div>
    <div id="alarmPanel" class="hidden fixed right-6 top-16 w-96 max-h-[520px] overflow-hidden glass-card rounded-xl z-50 border border-rose-500/20 shadow-2xl flex flex-col">
        <div class="p-4 border-b border-borderBg flex justify-between items-center shrink-0">
            <div class="flex items-center space-x-2">
                <i data-lucide="bell-ring" class="w-4 h-4 text-rose-400"></i>
                <span class="text-sm font-semibold text-white">实时告警通知</span>
            </div>
            <button onclick="toggleAlarmPanel()" class="text-gray-400 hover:text-white p-1 transition">
                <i data-lucide="x" class="w-4 h-4"></i>
            </button>
        </div>
        <div id="alarmFeedList" class="p-3 space-y-2 overflow-y-auto flex-1">
            <p class="text-xs text-gray-500 text-center py-8">暂无告警</p>
        </div>
    </div>

    <main class="max-w-[1600px] mx-auto p-6 space-y-6">

        <section class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <div class="glass-card p-6 rounded-xl flex items-center justify-between">
                <div class="space-y-1">
                    <p class="text-sm text-gray-400 font-medium">接入设备总数</p>
                    <h3 id="totalDevices" class="text-3xl font-bold text-white">--</h3>
                </div>
                <div class="p-4 bg-blue-500/10 text-blue-400 rounded-xl"><i data-lucide="layers" class="w-6 h-6"></i></div>
            </div>
            <div class="glass-card p-6 rounded-xl flex items-center justify-between">
                <div class="space-y-1">
                    <p class="text-sm text-gray-400 font-medium">当前在线设备</p>
                    <h3 id="onlineDevices" class="text-3xl font-bold text-emerald-400">--</h3>
                </div>
                <div class="p-4 bg-emerald-500/10 text-emerald-400 rounded-xl"><i data-lucide="wifi" class="w-6 h-6"></i></div>
            </div>
            <div class="glass-card p-6 rounded-xl flex items-center justify-between">
                <div class="space-y-1">
                    <p class="text-sm text-gray-400 font-medium">异常离线设备</p>
                    <h3 id="offlineDevices" class="text-3xl font-bold text-rose-400">--</h3>
                </div>
                <div class="p-4 bg-rose-500/10 text-rose-400 rounded-xl"><i data-lucide="wifi-off" class="w-6 h-6"></i></div>
            </div>
            <div class="glass-card p-6 rounded-xl flex items-center justify-between">
                <div class="space-y-1">
                    <p class="text-sm text-gray-400 font-medium">设备综合在线率</p>
                    <h3 id="onlineRate" class="text-3xl font-bold text-amber-400">--%</h3>
                </div>
                <div class="p-4 bg-amber-500/10 text-amber-400 rounded-xl"><i data-lucide="activity" class="w-6 h-6"></i></div>
            </div>
        </section>

        <section class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="glass-card p-5 rounded-xl space-y-4">
                <div class="flex items-center space-x-2 border-b border-borderBg pb-3">
                    <i data-lucide="plus-circle" class="w-5 h-5 text-blue-400"></i>
                    <h2 class="text-md font-semibold text-white">快捷注册新设备</h2>
                </div>
                <form id="registerForm" class="space-y-4 text-sm">
                    <div>
                        <label class="block text-gray-400 mb-1.5">设备唯一编码 (Device ID)</label>
                        <input type="text" name="device_id" placeholder="例如: temp-sensor-06" required class="w-full bg-darkBg border border-borderBg rounded-lg px-3 py-2 text-white focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-gray-400 mb-1.5">设备名称</label>
                        <input type="text" name="device_name" placeholder="例如: 6号机房温湿度计" required class="w-full bg-darkBg border border-borderBg rounded-lg px-3 py-2 text-white focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-gray-400 mb-1.5">设备类型</label>
                        <select name="device_type" class="w-full bg-darkBg border border-borderBg rounded-lg px-3 py-2 text-white focus:outline-none focus:border-blue-500">
                            <option value="temperature_sensor">温度传感器</option>
                            <option value="humidity_sensor">湿度传感器</option>
                            <option value="multi_sensor">多合一传感器</option>
                            <option value="gateway">网关</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-gray-400 mb-1.5">部署位置</label>
                        <input type="text" name="location" placeholder="例如: 办公楼3层A区" class="w-full bg-darkBg border border-borderBg rounded-lg px-3 py-2 text-white focus:outline-none focus:border-blue-500">
                    </div>
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded-lg transition flex items-center justify-center space-x-2">
                        <i data-lucide="send" class="w-4 h-4"></i>
                        <span>提交注册</span>
                    </button>
                    <p id="registerMsg" class="text-xs text-center hidden"></p>
                </form>
            </div>

            <div class="glass-card p-5 rounded-xl lg:col-span-2 flex flex-col">
                <div class="flex justify-between items-center border-b border-borderBg pb-3 mb-4">
                    <div class="flex items-center space-x-2">
                        <i data-lucide="trending-up" class="w-5 h-5 text-purple-400"></i>
                        <h2 class="text-md font-semibold text-white">环境温湿度流式历史趋势图</h2>
                    </div>
                    <span class="text-xs text-gray-400">最近 20 条上报数据动态追踪</span>
                </div>
                <div id="trendChart" class="w-full flex-1 min-h-[260px]"></div>
            </div>
        </section>

        <section class="glass-card rounded-xl overflow-hidden">
            <div class="px-6 py-4 border-b border-borderBg bg-cardBg/30 flex justify-between items-center">
                <div class="flex items-center space-x-2">
                    <i data-lucide="list" class="w-5 h-5 text-blue-400"></i>
                    <h2 class="text-md font-semibold text-white">全量接入设备明细看板</h2>
                </div>
                <span class="text-xs text-gray-400">每 10 秒流式自动轮询刷新</span>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm">
                    <thead class="bg-cardBg/80 text-gray-400 uppercase text-xs tracking-wider border-b border-borderBg">
                        <tr>
                            <th class="px-6 py-3.5 font-medium">设备编码</th>
                            <th class="px-6 py-3.5 font-medium">设备名称</th>
                            <th class="px-6 py-3.5 font-medium">设备类型</th>
                            <th class="px-6 py-3.5 font-medium">位置</th>
                            <th class="px-6 py-3.5 font-medium">实时状态</th>
                            <th class="px-6 py-3.5 font-medium">最新温度</th>
                            <th class="px-6 py-3.5 font-medium">最新湿度</th>
                            <th class="px-6 py-3.5 font-medium">电量</th>
                            <th class="px-6 py-3.5 font-medium">最后上报</th>
                            <th class="px-6 py-3.5 font-medium text-center">操作</th>
                        </tr>
                    </thead>
                    <tbody id="deviceTableBody" class="divide-y divide-borderBg/50">
                        <tr><td colspan="10" class="px-6 py-10 text-center text-gray-500">正在加载数据...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <script>
        const API_BASE = (() => {
            const host = window.location.hostname;
            if (host === "localhost" || host === "127.0.0.1" || host === "" || window.location.protocol === "file:") {
                return "http://localhost:8000/api/v1";
            }
            return "https://iot-platform-api.onrender.com/api/v1";
        })();
        const STATUS_MAP = { 0: "离线", 1: "在线", 2: "故障" };
        const STATUS_COLOR = { 0: "bg-gray-500/10 text-gray-400", 1: "bg-emerald-500/10 text-emerald-400", 2: "bg-rose-500/10 text-rose-400" };

        async function apiGet(path) {
            const res = await fetch(`${API_BASE}${path}`);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const json = await res.json();
            if (json.code !== 0) throw new Error(json.message);
            return json.data;
        }

        async function apiPost(path, body) {
            const res = await fetch(`${API_BASE}${path}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(body),
            });
            const json = await res.json();
            if (!res.ok) throw new Error(json.detail || `HTTP ${res.status}`);
            return json;
        }

        async function apiDelete(path) {
            const res = await fetch(`${API_BASE}${path}`, { method: "DELETE" });
            const json = await res.json();
            if (!res.ok) throw new Error(json.detail || `HTTP ${res.status}`);
            return json;
        }

        // ==================== Summary ====================
        async function refreshSummary() {
            try {
                const d = await apiGet("/dashboard/summary");
                document.getElementById("totalDevices").textContent = d.total_devices;
                document.getElementById("onlineDevices").textContent = d.online_count;
                document.getElementById("offlineDevices").textContent = d.offline_count;
                document.getElementById("onlineRate").textContent = `${d.online_rate}%`;
            } catch (e) {
                console.error("汇总加载失败:", e);
            }
        }

        // ==================== Trend Chart ====================
        const chartDom = document.getElementById("trendChart");
        const trendChart = echarts.init(chartDom, "dark");
        const chartOption = {
            backgroundColor: "transparent",
            tooltip: { trigger: "axis" },
            legend: { data: ["温度 (°C)", "湿度 (%)"], textStyle: { color: "#9ca3af" } },
            grid: { top: "15%", left: "3%", right: "4%", bottom: "5%", containLabel: true },
            xAxis: { type: "category", data: [], axisLine: { lineStyle: { color: "#232d3f" } }, axisLabel: { rotate: 30, fontSize: 10 } },
            yAxis: { type: "value", splitLine: { lineStyle: { color: "#232d3f" } } },
            series: [
                { name: "温度 (°C)", type: "line", smooth: true, data: [], itemStyle: { color: "#3b82f6" }, symbol: "circle", symbolSize: 4 },
                { name: "湿度 (%)", type: "line", smooth: true, data: [], itemStyle: { color: "#10b981" }, symbol: "circle", symbolSize: 4 },
            ],
        };
        trendChart.setOption(chartOption);
        window.addEventListener("resize", () => trendChart.resize());

        async function refreshTrend() {
            try {
                const data = await apiGet("/dashboard/trend?limit=20");
                const times = data.map(r => {
                    const d = new Date(r.reported_at);
                    return d.toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
                });
                const temps = data.map(r => r.temperature);
                const hums = data.map(r => r.humidity);
                trendChart.setOption({
                    xAxis: { data: times },
                    series: [{ data: temps }, { data: hums }],
                });
            } catch (e) {
                console.error("趋势数据加载失败:", e);
            }
        }

        // ==================== Device Table ====================
        async function refreshDeviceTable() {
            const tbody = document.getElementById("deviceTableBody");
            try {
                const devices = await apiGet("/devices");
                if (devices.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="10" class="px-6 py-10 text-center text-gray-500">暂无设备，请先注册或启动模拟器</td></tr>';
                    return;
                }

                const rows = await Promise.all(
                    devices.map(async d => {
                        let temp = "--", hum = "--", batt = "--";
                        try {
                            const latest = await apiGet(`/dashboard/devices/${d.device_id}/latest`);
                            temp = latest.temperature != null ? `${latest.temperature}℃` : "--";
                            hum = latest.humidity != null ? `${latest.humidity}%` : "--";
                            batt = latest.battery_level != null ? `${latest.battery_level}%` : "--";
                        } catch (_) {}

                        const lastOnline = d.last_online_at
                            ? new Date(d.last_online_at).toLocaleString("zh-CN")
                            : "--";

                        const statusLabel = STATUS_MAP[d.status] ?? "未知";
                        const statusCls = STATUS_COLOR[d.status] ?? STATUS_COLOR[0];

                        const hasAlarm = activeAlarmDeviceIds.has(d.device_id);
                        const rowBgClass = hasAlarm ? "bg-rose-500/10 hover:bg-rose-500/20 transition ring-1 ring-rose-500/20" : "hover:bg-cardBg/30 transition";
                        const alarmDot = hasAlarm ? '<span class="w-2 h-2 rounded-full bg-rose-500 animate-pulse inline-block ml-1.5" title="设备告警中"></span>' : "";

                        return `<tr class="${rowBgClass}">
                            <td class="px-6 py-3 font-mono text-xs">${d.device_id}</td>
                            <td class="px-6 py-3 font-medium">${d.device_name}${alarmDot}</td>
                            <td class="px-6 py-3 text-xs text-gray-400">${d.device_type}</td>
                            <td class="px-6 py-3 text-xs text-gray-400">${d.location || "--"}</td>
                            <td class="px-6 py-3"><span class="inline-flex px-2 py-0.5 rounded-full text-xs font-medium ${statusCls}">${statusLabel}</span></td>
                            <td class="px-6 py-3">${temp}</td>
                            <td class="px-6 py-3">${hum}</td>
                            <td class="px-6 py-3">${batt}</td>
                            <td class="px-6 py-3 text-xs text-gray-400">${lastOnline}</td>
                            <td class="px-6 py-3 text-center">
                                <button onclick="deleteDevice('${d.device_id}')" class="p-1.5 hover:bg-rose-500/10 rounded text-gray-400 hover:text-rose-400 transition" title="删除设备">
                                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                                </button>
                            </td>
                        </tr>`;
                    })
                );

                tbody.innerHTML = rows.join("");
                lucide.createIcons();
            } catch (e) {
                console.error("设备列表加载失败:", e);
                tbody.innerHTML = '<tr><td colspan="10" class="px-6 py-10 text-center text-gray-500">加载失败，请确认后端服务已启动</td></tr>';
            }
        }

        // ==================== Actions ====================
        async function deleteDevice(deviceId) {
            if (!confirm(`确认删除设备 ${deviceId} 吗？此操作不可撤销。`)) return;
            try {
                await apiDelete(`/devices/${deviceId}`);
                await refreshAll();
            } catch (e) {
                alert(`删除失败: ${e.message}`);
            }
        }

        document.getElementById("registerForm").addEventListener("submit", async e => {
            e.preventDefault();
            const form = e.target;
            const msg = document.getElementById("registerMsg");
            const payload = {
                device_id: form.device_id.value.trim(),
                device_name: form.device_name.value.trim(),
                device_type: form.device_type.value,
                location: form.location.value.trim() || null,
            };

            try {
                await apiPost("/devices", payload);
                msg.className = "text-xs text-center text-emerald-400";
                msg.textContent = `设备 ${payload.device_id} 注册成功！`;
                form.reset();
                await refreshAll();
            } catch (err) {
                msg.className = "text-xs text-center text-rose-400";
                msg.textContent = `注册失败: ${err.message}`;
            }
            msg.classList.remove("hidden");
        });

        // ==================== Alarms ====================
        let activeAlarmDeviceIds = new Set();

        function toggleAlarmPanel() {
            const panel = document.getElementById("alarmPanel");
            const overlay = document.getElementById("alarmOverlay");
            panel.classList.toggle("hidden");
            overlay.classList.toggle("hidden");
            if (!panel.classList.contains("hidden")) {
                lucide.createIcons();
            }
        }

        async function refreshAlarms() {
            try {
                const active = await apiGet("/alarms/active");
                activeAlarmDeviceIds = new Set(active.map(a => a.device_id));

                const badge = document.getElementById("alarmBadge");
                const count = document.getElementById("alarmCount");
                if (active.length > 0) {
                    badge.classList.remove("hidden");
                    count.textContent = `${active.length} 条告警`;
                } else {
                    badge.classList.add("hidden");
                }

                const feed = await apiGet("/alarms/feed?limit=15");
                const feedList = document.getElementById("alarmFeedList");
                if (feed.length === 0) {
                    feedList.innerHTML = '<p class="text-xs text-gray-500 text-center py-8">暂无告警</p>';
                } else {
                    feedList.innerHTML = feed.map(f => {
                        const time = new Date(f.triggered_at).toLocaleTimeString("zh-CN");
                        const isResolved = f.alarm_type && f.alarm_type.endsWith("_resolved");
                        if (isResolved) {
                            return `<div class="bg-emerald-500/5 border border-emerald-500/10 rounded-lg p-3 text-xs space-y-1">
                                <div class="flex items-center space-x-1.5 text-emerald-400 font-medium">
                                    <i data-lucide="check-circle" class="w-3 h-3"></i>
                                    <span>${f.device_id} · 已恢复</span>
                                </div>
                                <div class="text-gray-300">${f.message}</div>
                                <div class="text-gray-500">${time}</div>
                            </div>`;
                        }
                        return `<div class="bg-rose-500/5 border border-rose-500/10 rounded-lg p-3 text-xs space-y-1">
                            <div class="flex items-center space-x-1.5 text-rose-400 font-medium">
                                <i data-lucide="alert-triangle" class="w-3 h-3"></i>
                                <span>${f.device_id}</span>
                            </div>
                            <div class="text-gray-300">${f.message}</div>
                            <div class="text-gray-500">${time}</div>
                        </div>`;
                    }).join("");
                    lucide.createIcons();
                }
            } catch (e) {
                console.error("告警数据加载失败:", e);
            }
        }

        // ==================== Main Loop ====================
        async function refreshAll() {
            await Promise.all([refreshSummary(), refreshDeviceTable(), refreshTrend(), refreshAlarms()]);
        }

        document.getElementById("refreshBtn").addEventListener("click", refreshAll);

        lucide.createIcons();
        refreshAll();
        setInterval(refreshAll, 10_000);
    </script>
</body>
</html>
